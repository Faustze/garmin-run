# Профиль и зоны. Источник истины для целей в тренировках:
# тренировки в Garmin получают конкретные числа отсюда, а не зоны из настроек часов.

goal:
  race: Марафон
  date: 2027-09-26
  target: "3:50:00"          # 5:27/км

availability:
  runs_per_week: 5
  long_run_day: sun
  rest_days: [tue, sat]

hr:
  max: 179                   # со слов. Но полумарафон 26.04 прошёл на среднем 170 почти 2 часа — это 95% от 179,
                             # так долго не держат. Скорее реальный максимум выше или датчик на запястье завышал.
  lthr_estimate: 168         # порог ≈ средний пульс на ~2-часовом полумарафоне; уточнить контрольным забегом

# Ориентиры по форме: полумарафон 26.04 за 1:56:37 ≈ VDOT 38, цель 3:50 ≈ VDOT 40.
paces:
  current_marathon: "5:41"
  goal_marathon: "5:27"

# Для оценки длительности шагов без цели по темпу
estimate_pace: "6:20"

# Именованные цели для шагов тренировок. Лёгкое — по пульсу, работа — по темпу.
targets:
  recovery:  {hr: [115, 140]}
  easy:      {hr: [125, 150]}
  steady:    {hr: [148, 158]}
  marathon:  {pace: "5:24-5:32"}
  threshold: {pace: "5:12-5:22"}
  interval:  {pace: "4:50-5:00"}
  stride:    {}
