name: Лёгкий 50 + горки (дорожка)
description: >-
  40 мин легко по пульсу, затем 4 подъёма по 30 с.
  Ускорения на дорожке не работают: разгон съедает половину повтора, поэтому вместо скорости берём уклон.
steps:
  - run: 40min @ easy
  - repeat: 4
    steps:
      - run: {time: 30s, note: "уклон 5–6%, скорость лёгкая, не прибавлять"}
      - recover: {time: 90s, note: "уклон обратно 0–1%, шаг или трусца"}
  - cooldown: 3min @ recovery
