name: Зал всё тело ~45 мин
description: >-
  Второй зал недели: спина, грудь, плечи, кор и задняя цепь. Ноги тут лёгкие — тяжёлые ноги в понедельник.
  Запас 2 повтора в каждом подходе, до отказа не идём. Вес растёт, когда все подходы выходят с запасом.
  На часах не записывать. После тренировки: Garmin Connect → «+» → «Добавить активность вручную» → «Силовая», 45 мин.
sport: strength
steps:
  - warmup: {time: 6min, note: "Гребной тренажёр или быстрый шаг, затем 10 махов руками, 10 «кошек», 10 ягодичных мостов"}

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Тяга верхнего блока или подтягивания — 8–10.
            Лопатки вниз и назад до движения руками, тянуть к верху груди, корпус не раскачивать.
      - rest: 90s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Жим гантелей лёжа или отжимания — 8–12.
            Лопатки сведены, локти под 45° к корпусу, вниз медленно (2–3 с).
      - rest: 90s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Тяга гантели в наклоне одной рукой — 10 на каждую.
            Спина ровная, тянуть локоть к бедру, а не к плечу; наверху пауза 1 с.
      - rest: 60s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Румынская тяга с гантелями — 10, умеренный вес.
            Колени чуть согнуты, таз назад, спина ровная, гантели скользят по бёдрам. Вниз до натяжения сзади бедра, не глубже.
      - rest: 90s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Жим гантелей стоя или сидя — 8–10.
            Пресс напряжён, поясницу не прогибать, гантели над головой по прямой.
      - rest: 60s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Кор-тройка без отдыха между упражнениями: планка 40 с, боковая планка 30 с на каждую сторону,
            «мёртвый жук» 10 на каждую сторону (поясница прижата к полу).
      - rest: 60s
