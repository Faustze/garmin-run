name: Длинный 65 мин блоками
description: >-
  Самая длинная пробежка недели, но не длительная: три блока по 20 минут, чтобы не было скучно, всё по пульсу.
  На дорожке меняется уклон, на улице — маршрут или направление. Потолок зимой — 13 км.
steps:
  - run: {time: 20min, target: easy, note: "блок 1: уклон 1%, вкатываться"}
  - run: {time: 20min, target: easy, note: "блок 2: уклон 2–3%, скорость ниже — пульс тот же, ≤150"}
  - run: {time: 20min, target: easy, note: "блок 3: уклон 1%; если легко — последние 10 мин чуть быстрее, но пульс ≤150"}
  - cooldown: 5min @ recovery
