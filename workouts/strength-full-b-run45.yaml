name: Зал Б — всё тело + 45–50 мин бега
description: >-
  Второй зал недели: прыжки, румынская тяга, тяги и жимы, кор. Ноги нагружаются второй раз, но через заднюю поверхность.
  До 08.11 — вход: 3×8–12, запас 3 повтора. В конце 45–50 мин лёгкого бега на дорожке — третья пробежка недели.
  Силовую на часах не записывать, после добавить вручную «Силовая», 45 мин. Бег записать обычной активностью «Беговая дорожка».
sport: strength
steps:
  - warmup: {time: 6min, note: "Гребной или велотренажёр, затем 10 наклонов с пустым грифом и 10 отжиманий"}

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Подпрыгивания на месте на двух ногах — 20 с.
            Колени почти прямые, отталкивание стопой, касание пола короткое и тихое. Это подготовка к плиометрике,
            не кардио. До 08.11 — только так; запрыгивания и многоскоки — с января.
      - rest: 60s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Румынская тяга со штангой или гантелями — 8–10 повторов.
            Колени чуть согнуты, таз назад, гриф скользит по ногам до середины голени, спина нейтральная.
            Вниз 3 с, натяжение в задней поверхности бедра. Запас 3 повтора.
      - rest: 2min

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: "Подтягивания или тяга верхнего блока — 8–10 повторов. Лопатки вниз, без раскачки."
      - rest: 90s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: "Жим гантелей лёжа или отжимания — 8–12 повторов. Лопатки сведены, локти под 45° к корпусу."
      - rest: 90s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: "Тяга гантели в наклоне одной рукой — 10 на сторону. Спина ровная, тянуть локтем к бедру."
      - rest: 60s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Кор: боковая планка 30–40 с на сторону, затем «мёртвый жук» 8 на сторону.
            Поясница прижата к полу, движение медленное.
      - rest: 45s

  - exercise:
      lap: true
      note: >-
        Бег 45–50 мин на дорожке, легко, пульс ≤150, уклон 1%. Ноги после тяги будут тяжёлые — это нормально, скорость ниже обычной.
        Записать отдельной активностью. Если после зала пульс не держится ≤150 даже на медленной скорости — остановиться на 30 мин. После ночи короче 5 часов — пропустить без замены.
