name: Зал А — ноги ~45 мин
description: >-
  Тяжёлые ноги под марафон: присед, сплит-присед, икры, задняя поверхность. До 08.11 — вход: 3×8–12, запас 3 повтора,
  вес такой, чтобы техника не ломалась. Дальше вес растёт, повторы падают (4×4–6 с 09.11).
  Боль в суставе или сухожилии (не жжение в мышце) — упражнение пропустить.
  На часах не записывать. После тренировки: Garmin Connect → «+» → «Добавить активность вручную» → «Силовая», 45 мин.
sport: strength
steps:
  - warmup:
      time: 8min
      note: >-
        Велотренажёр 4 мин, затем по одному подходу без веса: изометрический сплит-присед 30 с на ногу,
        «ракушка» с резинкой 15 на сторону, 10 приседаний.

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Присед со штангой или тяга с трэп-грифом — 8–10 повторов.
            Перед рабочими — 2 разминочных подхода с пустым грифом и половиной веса. Вниз 2–3 с, вверх уверенно,
            спина нейтральная, колени по линии стоп. Запас 3 повтора.
      - rest: 2min

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Сплит-присед с гантелями — 8 на каждую ногу.
            Передняя стопа целиком на полу (можно на блине 5–10 см), заднее колено почти до пола, корпус вертикально.
            Вниз 3 с, вверх толчком через всю стопу.
      - rest: 90s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Нордические сгибания (или сгибания ног в тренажёре) — 5–6 повторов.
            Стопы закреплены, корпус прямой от колен до плеч, опускаться вперёд как можно медленнее, руками поймать пол
            и оттолкнуться обратно. Первые недели — только медленный спуск.
      - rest: 90s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Подъём на носки стоя, на одной ноге с гантелью — 10–12 на ногу.
            Пятка со ступеньки, вниз 3 с до растяжения, наверху пауза 1 с. Колено прямое — икроножная.
      - rest: 60s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Подъём на носки сидя (тренажёр или блин на коленях) — 12–15 повторов.
            Колено согнуто — работает камбаловидная, главная мышца марафонца. Вниз 3 с, наверху пауза 1 с.
      - rest: 60s
