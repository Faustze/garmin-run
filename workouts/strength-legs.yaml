name: Силовая ноги ~40 мин
description: >-
  Сила для марафона: колени, ягодицы, ахилл. Отдых между подходами — как в шагах.
  Первые 3 недели без отказа: запас 2–3 повтора, в изометрии — 2–3 секунды.
  Боль в суставе или сухожилии (не жжение в мышце) — упражнение пропустить.
  На часах не записывать. После тренировки: Garmin Connect → «+» → «Добавить активность вручную» → «Силовая», 40 мин.
sport: strength
steps:
  - warmup: {time: 6min, note: "Велотренажёр или быстрый шаг, затем 10 приседаний и 10 выпадов без веса"}

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Изометрический сплит-присед — 30–45 с на каждую ногу.
            Выпад на месте, передняя стопа целиком на полу, заднее колено в 5–10 см от пола, корпус вертикально.
            Держать и давить передней пяткой в пол; колено по линии 2–3 пальца, внутрь не заваливать.
            Прогрессия — гантели. https://www.youtube.com/watch?v=lfX4W9lzzWs
      - rest: 60s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Сплит-присед с дефицитом — 6–8 на каждую ногу.
            Передняя нога на блине или степе 5–10 см, заднее колено опускается почти до пола.
            Вниз медленно (3 с), вверх толчком через всю стопу. Сначала без веса, потом гантели.
            https://www.youtube.com/watch?v=kBQ3NlMq9so
      - rest: 90s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Боковой спуск со ступеньки — 8–10 на каждую ногу.
            Стоишь боком на степе 15–20 см, свободная нога сбоку. Медленно (3 с) сгибаешь опорную
            и касаешься пола пяткой, не перенося вес. Таз ровно, колено не уходит внутрь.
            https://www.youtube.com/watch?v=AQ1kCW6DOKM
      - rest: 60s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Спуск вперёд со ступеньки — 8–10 на каждую ногу.
            Как боковой, но свободная нога впереди и касается пола пяткой перед степом.
            «Лестница вниз в замедленной съёмке»: колено по линии стопы, корпус не скручивать.
            https://www.youtube.com/watch?v=gDE83dy8mNA
      - rest: 60s

  - repeat: 2
    steps:
      - exercise:
          lap: true
          note: >-
            Ракушка с резинкой — 15 на каждую сторону.
            Лёжа на боку, колени согнуты под 45°, стопы вместе, резинка чуть выше колен.
            Поднять верхнее колено, стопы не разводить, таз не заваливать назад; наверху пауза 1–2 с.
            https://www.youtube.com/watch?v=wXbXHy8tjpw
      - rest: 30s

  - repeat: 3
    steps:
      - exercise:
          lap: true
          note: >-
            Изометрический подъём на носок — 30–45 с на каждую ногу.
            На одной ноге подняться на носок до середины амплитуды и держать, рукой можно за стену.
            Подходы 1–2 с прямым коленом (икроножная), подход 3 с согнутым (камбаловидная).
            Прогрессия — гантель. https://www.youtube.com/watch?v=jewmeO9A7A4
      - rest: 60s
